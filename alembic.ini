# Alembic config for developers (creating new migrations):
#     uv run alembic revision --autogenerate -m "describe the change"
# Users never need it: `kide db upgrade` configures Alembic in code.
# The database URL comes from DATABASE_URL / DATA_DIR in .env.

[alembic]
script_location = %(here)s/src/kide/storage/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[post_write_hooks]
hooks = ruff_check, ruff_format
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
