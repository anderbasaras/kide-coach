# Install once with: uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6 # keep in sync with the ruff pin in pyproject.toml
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: forbid-personal-files
        name: Block personal data (.env, profile.yaml, var/)
        entry: Personal files must never be committed. Use .env.example / profile.example.yaml.
        language: fail
        files: '(^|/)(\.env|profile\.yaml)$|^var/'
