# Spanish. Must have exactly the same keys and placeholders as en.yaml.
meta:
  language_name: Español

commands:
  # `name` es lo que escribe el usuario. Todos los nombres funcionan en todos los idiomas;
  # el menú muestra los del idioma del usuario.
  start:
    name: start
    description: Saludo y comprobación del perfil
  today:
    name: hoy
    description: ¿Qué toca hoy? (check-in)
  help:
    name: ayuda
    description: Qué puedo hacer
  language:
    name: idioma
    description: Cambiar el idioma

start:
  greeting: "Hola, {name}. Soy Kide, tu entrenador híbrido."
  profile: "Tu perfil está cargado. Rotación: {rotation}. Check-in diario a las {time} ({timezone})."
  next: "Escribe /{today} para decirme qué toca hoy, o /{help} para ver qué puedo hacer."

help:
  intro: "Soy Kide, tu entrenador híbrido. Estos son mis comandos:"
  command: "/{name} · {description}"
  footer: "Cada día a las {time} te preguntaré qué toca hoy."

language:
  prompt: "Elige un idioma:"
  changed: "Hecho, a partir de ahora te hablo en español."

common:
  "yes": Sí
  "no": "No"
  cancel: Cancelar
  confirm: Confirmar
  edit: Corregir

checkin:
  reminder: "Recordatorio: todavía no me has dicho qué toca hoy."
  question: ¿Qué toca hoy?
  next_session: "Siguiente en tu rotación: {session}"
  options:
    gym: Gimnasio
    box: Box
    rest: Descanso
    other: Otro
  chosen_today: "Hoy: {choice}"
  chosen_on: "{date}: {choice}"
  already_answered: "Hoy ya está apuntado: {summary}."
  button_already_answered: "Ese día ya está apuntado. Escribe /{today} para ver lo de hoy."
  invalid_button: "Ese botón ya no vale. Escribe /{today} para empezar de nuevo."
  summary_box: "{choice} (fotos: {photos}, texto: {text})"
  summary_note: "{choice} (con nota)"
  summary_photos: "{choice} (fotos: {photos})"
  summary_note_photos: "{choice} (con nota, fotos: {photos})"
  summary_plain: "{choice}"

wod:
  ask: >-
    Mándame el WOD: texto, una o varias fotos de la pizarra, o las dos cosas.
    Cuando termines, pulsa «Listo».
  done_button: Listo
  received: "Recibido. Fotos: {photos} · Texto: {text}. Manda más o pulsa «Listo»."
  saved: "WOD guardado. Fotos: {photos} · Texto: {text}."
  saved_empty: Box apuntado, sin WOD.
  unsupported: Mándame el WOD como texto o foto, o pulsa «Listo».
  photo_too_large: >-
    Ese archivo es demasiado grande: Telegram solo deja a los bots descargar
    archivos de hasta 20 MB. Mándalo como foto.
  photo_failed: No he podido guardar esa foto. Vuelve a mandarla.

note:
  ask: >-
    {choice} apuntado. ¿Quieres añadir algo? Escribe una nota o manda una captura
    (Strava, el reloj...), o pulsa «Sin nota».
  skip_button: Sin nota
  done_button: Listo
  photo_received: "Captura guardada. Fotos: {photos}. Escribe una nota o pulsa «Listo»."
  saved: "Guardado: {summary}."
  unsupported: Escribe la nota como texto, manda una captura o pulsa «Sin nota».

day:
  fix_button: Corregir
  add_button: Añadir sesión
  pick_session: ¿Qué sesión quieres corregir?
  choose_type: "{session}. Elige lo que hiciste de verdad: lo apuntado en esa sesión se sustituye."
  delete_button: Borrar esta sesión
  corrected: "Corregido: {old} → {new}"
  deleted: "Sesión borrada. Queda apuntado: {summary}."
  deleted_empty: "Sesión borrada. Ese día no queda nada apuntado: escribe /{today} para responder otra vez."
  add_type: ¿Qué sesión añades?
  added: "Añadida: {choice}"
  rest_replaced: "Cambio el descanso por {choice}"
  nothing: "Ese día no hay nada apuntado. Escribe /{today}."
  gone: Esa sesión ya no existe.

formats:
  date: "%d/%m/%Y"

errors:
  generic: Algo ha fallado. Vuelve a intentarlo en un momento.
  profile_invalid: "Tu perfil tiene errores y no se ha podido cargar:\n{details}"

safety:
  medical_disclaimer: >-
    Kide no es consejo médico. Si notas dolor agudo, dolor en el pecho o mareos,
    para de entrenar y consulta a un médico.
