# English (fallback locale: every key must exist here).
# Keys are grouped by feature. Placeholders use {name} syntax and must match across locales.
meta:
  language_name: English

commands:
  # `name` is what the user types. Every name works in every language; the menu shows
  # the names of the user's language. English names must equal the command id.
  start:
    name: start
    description: Greeting and profile check
  today:
    name: today
    description: What's on today? (check-in)
  help:
    name: help
    description: What I can do
  language:
    name: language
    description: Change the language

start:
  greeting: "Hi {name}, I'm Kide, your hybrid training coach."
  profile: "Your profile is loaded. Rotation: {rotation}. Daily check-in at {time} ({timezone})."
  next: "Send /{today} to tell me what's on today, or /{help} to see what I can do."

help:
  intro: "I'm Kide, your hybrid training coach. These are my commands:"
  command: "/{name} · {description}"
  footer: "Every day at {time} I'll ask you what's on today."

language:
  prompt: "Choose a language:"
  changed: "Done, I'll speak English from now on."

common:
  "yes": "Yes"
  "no": "No"
  cancel: Cancel
  confirm: Confirm
  edit: Edit

checkin:
  question: What's on today?
  next_session: "Next in your rotation: {session}"
  options:
    gym: Gym
    box: Box
    rest: Rest
    other: Other

errors:
  generic: Something went wrong. Please try again in a moment.
  profile_invalid: "Your profile has errors and could not be loaded:\n{details}"

safety:
  medical_disclaimer: >-
    Kide is not medical advice. If you feel acute pain, chest pain or dizziness,
    stop training and see a doctor.
