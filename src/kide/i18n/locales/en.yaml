# English (fallback locale: every key must exist here).
# Keys are grouped by feature. Placeholders use {name} syntax and must match across locales.
meta:
  language_name: English

commands:
  # `name` is what the user types. Every name works in every language; the menu shows
  # the names of the user's language. English names must equal the command id.
  start:
    name: start
    description: Greeting and profile check
  today:
    name: today
    description: What's on today? (check-in)
  help:
    name: help
    description: What I can do
  language:
    name: language
    description: Change the language

start:
  greeting: "Hi {name}, I'm Kide, your hybrid training coach."
  profile: "Your profile is loaded. Rotation: {rotation}. Daily check-in at {time} ({timezone})."
  next: "Send /{today} to tell me what's on today, or /{help} to see what I can do."

help:
  intro: "I'm Kide, your hybrid training coach. These are my commands:"
  command: "/{name} · {description}"
  footer: "Every day at {time} I'll ask you what's on today."

language:
  prompt: "Choose a language:"
  changed: "Done, I'll speak English from now on."

common:
  "yes": "Yes"
  "no": "No"
  cancel: Cancel
  confirm: Confirm
  edit: Edit

checkin:
  reminder: "Reminder: you haven't told me what's on today yet."
  question: What's on today?
  next_session: "Next in your rotation: {session}"
  options:
    gym: Gym
    box: Box
    rest: Rest
    other: Other
  chosen_today: "Today: {choice}"
  chosen_on: "{date}: {choice}"
  already_answered: "Today is already logged: {summary}."
  button_already_answered: "That day is already logged. Send /{today} to see today."
  invalid_button: "That button is no longer valid. Send /{today} to start again."
  summary_box: "{choice} (photos: {photos}, text: {text})"
  summary_note: "{choice} (with a note)"
  summary_photos: "{choice} (photos: {photos})"
  summary_note_photos: "{choice} (with a note, photos: {photos})"
  summary_plain: "{choice}"

wod:
  ask: >-
    Send me the WOD: text, one or more photos of the whiteboard, or both.
    Tap “Done” when you're finished.
  done_button: Done
  received: "Got it. Photos: {photos} · Text: {text}. Send more or tap “Done”."
  saved: "WOD saved. Photos: {photos} · Text: {text}."
  saved_empty: Box logged, without the WOD.
  unsupported: Send me the WOD as text or a photo, or tap “Done”.
  photo_too_large: >-
    That file is too large: Telegram only lets bots download files up to 20 MB.
    Send it as a photo instead.
  photo_failed: I couldn't save that photo. Please send it again.

note:
  ask: >-
    {choice} logged. Want to add something? Write a note or send a screenshot
    (Strava, your watch...), or tap “No note”.
  skip_button: No note
  done_button: Done
  photo_received: "Screenshot saved. Photos: {photos}. Write a note or tap “Done”."
  saved: "Saved: {summary}."
  unsupported: Write the note as text, send a screenshot, or tap “No note”.

day:
  fix_button: Correct
  add_button: Add session
  pick_session: Which session do you want to correct?
  choose_type: "{session}. Choose what you actually did: what was logged for it is replaced."
  delete_button: Delete this session
  corrected: "Corrected: {old} → {new}"
  deleted: "Session deleted. Logged now: {summary}."
  deleted_empty: "Session deleted. Nothing is logged for that day: send /{today} to answer again."
  add_type: Which session are you adding?
  added: "Added: {choice}"
  rest_replaced: "Rest replaced with {choice}"
  nothing: "Nothing is logged for that day. Send /{today}."
  gone: That session no longer exists.

formats:
  date: "%Y-%m-%d"
  decimal_separator: "."

fallback:
  edited: I don't process edited messages. Send the change as a new message.
  photo: "To save a photo, first choose the session with /{today} (or “Add session”)."
  text: >-
    I can't chat yet: that arrives soon. For now, send /{today} to log your day
    or /{help} to see what I can do.
  unknown_command: "I don't know that command. Send /{help} to see mine."
  unsupported: "I can't use that kind of message. Send /{today} to log your day or /{help} for help."

errors:
  generic: Something went wrong. Please try again in a moment.
  profile_invalid: "Your profile has errors and could not be loaded:\n{details}"

safety:
  medical_disclaimer: >-
    Kide is not medical advice. If you feel acute pain, chest pain or dizziness,
    stop training and see a doctor.

parsed:
  # What Claude read, shown back to the user before saving.
  wod_formats:
    amrap: AMRAP
    emom: EMOM
    for_time: For time
    rounds: Rounds
    intervals: Intervals
    strength: Strength
    mixed: Mixed
    other: Other
  scaling:
    rx: Rx
    scaled: Scaled
    foundations: Foundations
  activity_types:
    run: Run
    walk: Walk
    hike: Hike
    bike: Bike
    row: Row
    swim: Swim
    other: Activity
  wod_header: "WOD · {format}"
  wod_header_titled: "{title} · {format}"
  block_label: "{label})"
  warmup: Warm-up
  minutes: "{value} min"
  every: "every {value} min"
  time_cap: "cap {value} min"
  rounds: "{value} rounds"
  sets: "{value} sets"
  interval: "{work} s on / {rest} s off"
  pct_1rm: "@ {value}% 1RM"
  movement_line: "• {text}"
  unknown_movement: "{name} (?)"
  reps: "{value}"
  sets_reps: "{sets}×{reps}"
  distance_m: "{value} m"
  calories: "{value} cal"
  seconds: "{value} s"
  load_kg: "{value} kg"
  load_implements: "{count}×{value} kg"
  height_cm: "{value} cm"
  level: "Level: {value}"
  result: "Result: {value}"
  notes: "Notes: {value}"
  unreadable: "Couldn't read: {value}"
  low_confidence: "⚠️ I'm not sure about this reading: please check it."
  distance_km: "{value} km"
  duration_hm: "{hours} h {minutes} min"
  duration_unknown: "duration ?"
  pace: "{value} /km"
  elevation: "+{value} m"
  heart_rate: "HR {value} bpm"
  rpe: "RPE {value}/10"
