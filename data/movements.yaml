# Movement catalog for box WODs and hybrid races.
#
# Used to normalise what is written on a whiteboard ("T2B", "C&J", "zancadas con saco")
# to one movement id. Phase 4 adds muscle groups, pattern and type to each entry.
#
# Fields:
#   id        snake_case, stable: stored in parsed WODs. Never rename; add an alias instead.
#   names     display name per bot language (same languages as the i18n locales).
#   category  barbell | dumbbell | kettlebell | gymnastics | bodyweight | monostructural
#             | odd_object
#   unit      how the work is usually counted: reps | cal | m | s
#   aliases   board spellings and abbreviations, in any language. Matching ignores case,
#             accents, punctuation and a trailing plural "s". An alias must point to one
#             movement only: leave out ambiguous ones (e.g. a bare "sentadilla").
#
# Names are descriptive and brand-free (principle 6). Aliases may include the trade names
# people write on boards (e.g. "skierg") so they can be recognised.
schema_version: 1
movements:
